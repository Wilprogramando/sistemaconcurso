<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="geometricPrecision">
  <!-- Escudo verde do estudo para a PM, sem placa atrás: o fundo é
       transparente e pega a cor da guia, clara ou escura. As formas são
       cheias e o visto é grosso de propósito, porque na guia o ícone cai
       para 16 px e traço fino some. -->
  <defs>
    <linearGradient id="escudo" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <path d="M32 3 58 12.8v21.9C58 48.2 47.6 58.6 32 61.5 16.4 58.6 6 48.2 6 34.7V12.8L32 3Z"
        fill="url(#escudo)"/>
  <path d="M20 32.5 28.6 41.4 44 24.8" fill="none" stroke="#ffffff" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
