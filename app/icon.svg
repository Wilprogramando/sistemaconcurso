<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" shape-rendering="geometricPrecision">
  <!-- Escudo verde do estudo para a PM. As formas são cheias e o visto é
       grosso de propósito: na guia do navegador o ícone cai para 16 px e
       traço fino some. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="escudo" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#fundo)"/>
  <path d="M32 7 52 14.6v17.1c0 12.3-7.9 21-20 24.3-12.1-3.3-20-12-20-24.3V14.6L32 7Z"
        fill="url(#escudo)"/>
  <path d="M21.5 32.6 28.6 39.8 43 24.8" fill="none" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
